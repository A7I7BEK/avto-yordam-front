<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 1024 256" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="brandGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5EF9"/>
      <stop offset="52%" stop-color="#5749F4"/>
      <stop offset="100%" stop-color="#342B9E"/>
    </linearGradient>
    <mask id="wrenchMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="rotate(-45 512 512)">
        <rect x="280" y="484" width="540" height="56" rx="28" fill="#FFFFFF"/>
        <rect x="120" y="456" width="160" height="112" rx="28" fill="#FFFFFF"/>
        <circle cx="880" cy="512" r="62" fill="#FFFFFF"/>
        <circle cx="880" cy="512" r="34" fill="#000000"/>
        <rect x="120" y="480" width="84" height="64" fill="#000000"/>
      </g>
    </mask>
  </defs>

  <!-- Mark -->
  <svg x="28" y="28" width="200" height="200" viewBox="0 0 1024 1024">
    <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#brandGrad)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF" mask="url(#wrenchMask)"/>
    <g stroke="#FFFFFF">
      <circle cx="512" cy="512" r="296" fill="none" stroke-width="60"/>
      <g stroke-width="48" stroke-linecap="round">
        <line x1="512" y1="568" x2="512" y2="792"/>
        <line x1="512" y1="568" x2="512" y2="792" transform="rotate(120 512 512)"/>
        <line x1="512" y1="568" x2="512" y2="792" transform="rotate(240 512 512)"/>
      </g>
      <circle cx="512" cy="512" r="52" fill="#FFFFFF" stroke="none"/>
    </g>
  </svg>

  <!-- Wordmark -->
  <text x="264" y="118" font-size="88" font-weight="600" fill="#2A2933">Avto Yordam</text>
  <text x="266" y="174" font-size="24" font-weight="600" letter-spacing="6" fill="#5749F4">AUTO SERVICE PLATFORM</text>
</svg>
