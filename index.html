<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link
      rel="icon"
      type="image/png"
      href="/logo/avto-yordam-app-icon.png"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <meta
      name="description"
      content="Avto Yordam — auto service platform"
    >
    <title>Avto Yordam</title>
    <script>
    'use strict';
    // Apply the persisted theme before the first paint to avoid flashing.
    (() => {
      try {
        let theme = 'light';
        const stored = localStorage.getItem('app-theme');
        const systemDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        if (stored === 'dark') {
          theme = 'dark';
        } else if (stored === 'system') {
          theme = systemDark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch {
        // Theme is reapplied by the store once the app boots.
      }
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
