<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Avto Yordam — Logo Render</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    >
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        background: #f3f3f6;
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .card {
        padding: 16px;
        background: #fff;
        border-radius: 12px;
      }
      .card.dark {
        background: linear-gradient(225deg, #6b5ef9, #342b9e);
      }
      .label {
        margin-bottom: 10px;
        font-size: 12px;
        color: #555;
      }
      .card.dark .label {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="card">
        <div class="label">App icon — 1024x1024</div>
        <svg
          id="icon"
          xmlns="http://www.w3.org/2000/svg"
          width="1024"
          height="1024"
          viewBox="0 0 1024 1024"
        >
          <defs>
            <linearGradient
              id="brandGrad1"
              x1="1"
              y1="0"
              x2="0"
              y2="1"
            >
              <stop
                offset="0%"
                stop-color="#6B5EF9"
              />
              <stop
                offset="52%"
                stop-color="#5749F4"
              />
              <stop
                offset="100%"
                stop-color="#342B9E"
              />
            </linearGradient>
            <mask
              id="wrenchMask1"
              maskUnits="userSpaceOnUse"
              maskContentUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="1024"
              height="1024"
            >
              <g transform="rotate(-45 512 512)">
                <rect
                  x="280"
                  y="484"
                  width="540"
                  height="56"
                  rx="28"
                  fill="#FFFFFF"
                />
                <rect
                  x="120"
                  y="456"
                  width="160"
                  height="112"
                  rx="28"
                  fill="#FFFFFF"
                />
                <circle
                  cx="880"
                  cy="512"
                  r="62"
                  fill="#FFFFFF"
                />
                <circle
                  cx="880"
                  cy="512"
                  r="34"
                  fill="#000000"
                />
                <rect
                  x="120"
                  y="480"
                  width="84"
                  height="64"
                  fill="#000000"
                />
              </g>
            </mask>
          </defs>
          <rect
            x="48"
            y="48"
            width="928"
            height="928"
            rx="224"
            fill="url(#brandGrad1)"
          />
          <rect
            x="0"
            y="0"
            width="1024"
            height="1024"
            fill="#FFFFFF"
            mask="url(#wrenchMask1)"
          />
          <g stroke="#FFFFFF">
            <circle
              cx="512"
              cy="512"
              r="296"
              fill="none"
              stroke-width="60"
            />
            <g
              stroke-width="48"
              stroke-linecap="round"
            >
              <line
                x1="512"
                y1="568"
                x2="512"
                y2="792"
              />
              <line
                x1="512"
                y1="568"
                x2="512"
                y2="792"
                transform="rotate(120 512 512)"
              />
              <line
                x1="512"
                y1="568"
                x2="512"
                y2="792"
                transform="rotate(240 512 512)"
              />
            </g>
            <circle
              cx="512"
              cy="512"
              r="52"
              fill="#FFFFFF"
              stroke="none"
            />
          </g>
        </svg>
      </div>

          <svg

            <rect

            />
            <rect

            <g stroke="#FFFFFF">

                />
                <line
                  x1="512"

                  y2="792"
                  transform="rotate(240 512 512)"
                />
              </g>
              <circle
                cx="512"
                cy="512"
                r="52"
                fill="#FFFFFF"
                stroke="none"
              />
            </g>
          </svg>
          <text
            x="264"
            y="118"
            font-size="88"
            font-weight="600"
            fill="#2A2933"
          >Avto Yordam</text>
          <text
            x="266"
            y="174"
            font-size="24"
            font-weight="600"
            letter-spacing="6"
            fill="#5749F4"
          >AUTO SERVICE PLATFORM</text>
        </svg>
      </div>

  </body>
</html>
